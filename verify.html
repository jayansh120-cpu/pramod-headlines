{% extends "base.html" %}{% block title %}OTP सत्यापन{% endblock %}
{% block content %}<div class="auth-card mx-auto"><h1 class="h3 fw-bold">OTP सत्यापन</h1><p class="text-secondary">आपके अधिकृत मोबाइल नंबर पर आया 6 अंकों का OTP दर्ज करें।</p>
<form method="post"><input class="form-control form-control-lg text-center mb-3" name="code" inputmode="numeric" pattern="[0-9]{4,10}" maxlength="10" placeholder="OTP दर्ज करें" required><button class="btn btn-danger btn-lg w-100">सत्यापित करें</button></form></div>{% endblock %}
